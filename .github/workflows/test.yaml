name: Go Test

on:
  push:
  workflow_dispatch:
    inputs:
      test:
        description: "integration"
        required: false
        default: 'false'
        type: boolean
  workflow_call:
    inputs:
      test:
        description: "integration"
        required: false
        default: 'false'
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: stable
      - name: Run tests
        run: go test ./... -v
